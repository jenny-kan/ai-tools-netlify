# Netlify configuration.
#
# The official Next.js runtime plugin turns the standard `next build` output
# into Netlify Functions — no standalone server involved (`output:
# "standalone"` in next.config.ts is skipped automatically when NETLIFY is
# set, and scripts/postbuild.mjs skips the self-hosting packaging).
#
# ── IMPORTANT: do NOT rely on install hooks for `prisma generate` ────────────
# Netlify caches node_modules between builds; when the cache is warm,
# `pnpm install` finishes in ~16ms as a NO-OP and the postinstall hook
# never runs. On top of that, Prisma 7's `prisma db push` no longer runs
# the generator (Prisma ≤6 did), and the generated client lives in
# src/generated/prisma which is gitignored — a cold checkout has none.
# The result is `next build` failing with:
#     Module not found: Can't resolve '@/generated/prisma/client'
#
# Therefore generation MUST be part of the explicit build chain:
#   1. `pnpm db:setup` → prisma generate (FATAL) + prisma db push (non-fatal)
#   2. `pnpm build`    → prisma generate again + next build + postbuild
#      (belt-and-braces: `build` works standalone on Vercel/Railway/Docker too)
#
# Environment variables to set in the Netlify UI (or via `netlify env:set`) —
# same table as the walkthrough in DEPLOYMENT.md:
#   DATABASE_URL (Neon POOLED, :6543, +?sslmode=require&connection_limit=1)
#   DIRECT_DATABASE_URL (Neon direct, :5432)
#   ADMIN_PASSWORD / ADMIN_SECRET / NEXT_PUBLIC_SITE_URL (+ optional email)

[build]
  command = "pnpm db:setup && pnpm build"
  publish = ".next"

[build.environment]
  # package.json engines requires Node >= 20.19; pin the build/runtime to 22.
  NODE_VERSION = "22"

[[plugins]]
  # Intentionally unpinned — Netlify resolves the latest runtime, which
  # tracks the newest Next.js releases.
  package = "@netlify/plugin-nextjs"

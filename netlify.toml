# Netlify configuration.
#
# The official Next.js runtime plugin turns the standard `next build` output
# into Netlify Functions — no standalone server involved (`output:
# "standalone"` in next.config.ts is skipped automatically when NETLIFY is
# set, and scripts/postbuild.mjs skips the self-hosting packaging).
#
# pnpm is picked up automatically via the `packageManager` field in
# package.json (corepack), so `pnpm install` + the `postinstall` hook
# (`prisma generate`) run as-is.
#
# `pnpm db:setup` runs `prisma db push` BEFORE the build: a fresh Neon
# database gets its tables created automatically on the first deploy (and
# stays in sync after schema changes). It is non-fatal by design — a failed
# sync logs a loud warning and the build continues; the admin dashboard's
# System status banner then shows the exact problem at runtime.
#
# Environment variables to set in the Netlify UI (or via `netlify env:set`) —
# same table as the Vercel walkthrough in DEPLOYMENT.md §1.4:
#   DATABASE_URL (Neon POOLED, :6543, +?sslmode=require&connection_limit=1)
#   DIRECT_DATABASE_URL (optional — Neon direct :5432; when missing, the
#                        direct host is derived from the pooled URL)
#   ADMIN_PASSWORD / ADMIN_SECRET / NEXT_PUBLIC_SITE_URL (+ optional email)

[build]
  command = "pnpm db:setup && pnpm build"
  publish = ".next"

[build.environment]
  # package.json engines requires Node >= 20.19; pin the build/runtime to 22.
  NODE_VERSION = "22"

[[plugins]]
  # Intentionally unpinned — Netlify resolves the latest runtime, which
  # tracks the newest Next.js releases.
  package = "@netlify/plugin-nextjs"
